<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billed-Upscaler | 100% Privat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the slider */
        input[type=range]::-webkit-slider-thumb {
            pointer-events: all;
            width: 40px;
            height: 40px;
            -webkit-appearance: none;
        }
        .clip-upscaled {
            clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col items-center p-6">

    <!-- Header -->
    <header class="text-center max-w-2xl mt-10 mb-10">
        <h1 class="text-4xl font-extrabold tracking-tight text-gray-900 mb-2">Billed-Upscaler</h1>
        <p class="text-lg text-gray-500">Forbedr og opskaler dine billeder direkte i browseren — 100% gratis og privat.</p>
    </header>

    <!-- Main App Container -->
    <main class="w-full max-w-3xl bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        
        <!-- Upload Zone -->
        <div id="uploadZone" class="border-2 border-dashed border-gray-300 rounded-xl p-10 text-center hover:bg-gray-50 transition-colors cursor-pointer relative">
            <input type="file" id="fileInput" accept="image/jpeg, image/png, image/webp" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
            <svg class="mx-auto h-12 w-12 text-gray-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
            </svg>
            <p class="text-gray-600 font-medium">Træk og slip dit billede her, eller klik for at vælge</p>
            <p class="text-sm text-gray-400 mt-1">Understøtter JPG, PNG, WebP</p>
        </div>

        <!-- Controls & Preview (Hidden by default) -->
        <div id="workspace" class="hidden flex flex-col gap-6">
            
            <!-- File Info -->
            <div class="flex justify-between items-center bg-gray-50 p-4 rounded-lg">
                <div>
                    <p id="fileName" class="font-semibold text-gray-700 truncate max-w-[200px] sm:max-w-xs"></p>
                    <p id="fileStats" class="text-sm text-gray-500"></p>
                </div>
                <button id="resetBtn" class="text-sm text-red-500 hover:text-red-700 font-medium">Fjern / Nyt billede</button>
            </div>

            <!-- Settings -->
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <span class="font-medium text-gray-700">Opskaleringsfaktor:</span>
                    <label class="flex items-center gap-1 cursor-pointer">
                        <input type="radio" name="scale" value="2" checked class="text-blue-600 focus:ring-blue-500">
                        <span>2x</span>
                    </label>
                    <label class="flex items-center gap-1 cursor-pointer">
                        <input type="radio" name="scale" value="4" class="text-blue-600 focus:ring-blue-500">
                        <span>4x</span>
                    </label>
                </div>
                <button id="upscaleBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg shadow-sm transition-colors flex items-center gap-2">
                    <span>Opskaler Billede</span>
                    <svg id="spinner" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </div>

            <!-- Result Area (Hidden by default) -->
            <div id="resultArea" class="hidden flex-col gap-4 mt-4">
                
                <div class="flex justify-between items-end">
                    <div>
                        <h3 class="text-lg font-bold text-gray-800">Resultat</h3>
                        <p id="newResolution" class="text-sm text-blue-600 font-medium"></p>
                    </div>
                    <a id="downloadBtn" href="#" download="upscaled.png" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-6 rounded-lg shadow-sm transition-colors">
                        Download Billede
                    </a>
                </div>

                <!-- Before/After Slider -->
                <div class="relative w-full h-[400px] bg-gray-100 rounded-lg overflow-hidden border border-gray-200 mt-2 select-none group">
                    <!-- Original Image -->
                    <img id="imgBefore" class="absolute inset-0 w-full h-full object-contain pointer-events-none" alt="Original">
                    
                    <!-- Upscaled Image -->
                    <img id="imgAfter" class="absolute inset-0 w-full h-full object-contain pointer-events-none clip-upscaled" alt="Upscaled">
                    
                    <!-- Slider Line -->
                    <div id="sliderLine" class="absolute top-0 bottom-0 w-1 bg-white left-[50%] -translate-x-1/2 pointer-events-none z-20 shadow-[0_0_5px_rgba(0,0,0,0.3)] flex justify-center items-center">
                        <div class="w-8 h-8 bg-white rounded-full shadow-md flex items-center justify-center">
                            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4"></path></svg>
                        </div>
                    </div>
                    
                    <!-- Slider Input -->
                    <input type="range" min="0" max="100" value="50" id="slider" class="absolute inset-0 w-full h-full opacity-0 cursor-ew-resize z-30">
                    
                    <!-- Labels -->
                    <span class="absolute top-4 left-4 bg-black/60 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity">Original</span>
                    <span class="absolute top-4 right-4 bg-blue-600 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity">Opskaleret</span>
                </div>
                
            </div>
        </div>
    </main>

    <script>
        // DOM Elements
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const workspace = document.getElementById('workspace');
        const fileNameEl = document.getElementById('fileName');
        const fileStatsEl = document.getElementById('fileStats');
        const resetBtn = document.getElementById('resetBtn');
        const upscaleBtn = document.getElementById('upscaleBtn');
        const spinner = document.getElementById('spinner');
        const resultArea = document.getElementById('resultArea');
        const newResolution = document.getElementById('newResolution');
        const imgBefore = document.getElementById('imgBefore');
        const imgAfter = document.getElementById('imgAfter');
        const downloadBtn = document.getElementById('downloadBtn');
        const slider = document.getElementById('slider');
        const sliderLine = document.getElementById('sliderLine');

        let currentImage = null;
        let originalWidth = 0;
        let originalHeight = 0;

        // Utilities
        const formatBytes = (bytes) => {
            if (bytes === 0) return '0 Bytes';
            const k = 1024, sizes = ['Bytes', 'KB', 'MB'], i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        };

        // Handle File Input
        const handleFile = (file) => {
            if (!file || !file.type.startsWith('image/')) return;
            
            fileNameEl.textContent = file.name;
            const reader = new FileReader();
            
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalWidth = img.width;
                    originalHeight = img.height;
                    fileStatsEl.textContent = `${originalWidth} x ${originalHeight} px • ${formatBytes(file.size)}`;
                    
                    imgBefore.src = e.target.result;
                    currentImage = img;
                    
                    // Toggle UI
                    uploadZone.classList.add('hidden');
                    workspace.classList.remove('hidden');
                    resultArea.classList.add('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
        resetBtn.addEventListener('click', () => {
            fileInput.value = '';
            uploadZone.classList.remove('hidden');
            workspace.classList.add('hidden');
        });

        // Drag and drop styling
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('border-blue-500', 'bg-blue-50');
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('border-blue-500', 'bg-blue-50');
        });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('border-blue-500', 'bg-blue-50');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        // Slider Logic
        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            imgAfter.style.clipPath = `polygon(${val}% 0, 100% 0, 100% 100%, ${val}% 100%)`;
            sliderLine.style.left = `${val}%`;
        });

        // Upscale Logic (Client-side Canvas)
        upscaleBtn.addEventListener('click', () => {
            if (!currentImage) return;

            // UI Loading state
            upscaleBtn.disabled = true;
            spinner.classList.remove('hidden');
            
            // Allow UI to update before heavy processing
            setTimeout(() => {
                const scale = parseInt(document.querySelector('input[name="scale"]:checked').value);
                const targetWidth = originalWidth * scale;
                const targetHeight = originalHeight * scale;

                // Create off-screen canvas
                const canvas = document.createElement('canvas');
                canvas.width = targetWidth;
                canvas.height = targetHeight;
                const ctx = canvas.getContext('2d');

                // High-quality upscaling settings
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                
                // Draw upscaled
                ctx.drawImage(currentImage, 0, 0, targetWidth, targetHeight);
                
                // Get result
                const upscaledDataUrl = canvas.toDataURL('image/png');
                
                // Update UI
                imgAfter.src = upscaledDataUrl;
                downloadBtn.href = upscaledDataUrl;
                downloadBtn.download = `upscaled_${scale}x_${fileNameEl.textContent}`;
                newResolution.textContent = `${originalWidth}x${originalHeight} ➔ ${targetWidth}x${targetHeight}`;
                
                resultArea.classList.remove('hidden');
                upscaleBtn.disabled = false;
                spinner.classList.add('hidden');
                
                // Reset slider
                slider.value = 50;
                imgAfter.style.clipPath = `polygon(50% 0, 100% 0, 100% 100%, 50% 100%)`;
                sliderLine.style.left = `50%`;

            }, 100); // Small timeout to ensure spinner renders
        });
    </script>
</body>
</html>
